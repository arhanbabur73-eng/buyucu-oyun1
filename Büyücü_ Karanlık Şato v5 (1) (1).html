<script>

{const _sb=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,"shadowBlur");Object.defineProperty(g,"shadowBlur",{configurable:true,get(){return _sb.get.call(g)},set(v){_sb.set.call(g,Math.min(v,7))}})}

function nz(d,f0,f1,v=.1,q=1.2){try{const n=AC.currentTime,len=Math.max(1,AC.sampleRate*d|0),b=AC.createBuffer(1,len,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type="bandpass";f.Q.value=q;f.frequency.setValueAtTime(f0,n);f.frequency.exponentialRampToValueAtTime(f1,n+d);const gn=AC.createGain();gn.gain.setValueAtTime(v,n);gn.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start()}catch(e){}}

function windSnd(){nz(.75,180,2000,.24,.8);nz(.55,1400,260,.12,1);snd(110,.5,"sine",.16);setTimeout(()=>snd(420,.35,"triangle",.03),90)}

function mk(k,x,m){const s=ST[k],e={k,...s,hp:s.hp*m,dmg:s.dmg*(m>1?1.25:1),sp:s.sp*(m>1?1.12:1),x,y:GY-s.h,vx:0,vy:0,gr:0,dir:-1,cd:60,sw:0,swT:1,hitAt:0,dt:0,hu:0,kb:0,atk:0,at:0,t:90,thr:0};e.max=e.hp;en.push(e);return e}
function load(n){
 lvl=n;state="play";hs=0;done=0;realm=0;gp=0;xf=0;fx=[];lz=[];GY=H-80;WORLD=n==3?2100:n==1?3600:4000;camX=0;WORLD=Math.max(WORLD,W+80);
 plats=[{x:0,y:GY,w:WORLD,g:1,dx:0,m:0}];en=[];parts=[];pr=[];ep=[];items=[];boss=null;
 const D=[0,[[300,1,180],[600,2,150],[880,3,150],[1180,2,200],[1500,1,160],[1760,2,170],[2050,3,180],[2350,2,150],[2650,1,220],[2950,2,170],[3250,3,150]],
 [[400,1,140],[700,2,120,60],[1000,3,130],[1300,2,110,90],[1620,1,160],[1900,2,140],[2200,3,120,70],[2500,4,110],[2800,3,140],[3100,2,130,80],[3450,1,200]],
 [[250,1,200],[820,2,260],[1450,1,200]]][n];

 (S[n]||[]).forEach(([k,x])=>mk(k,x,n==2?1.4:1));
 if(n==3)boss=mk("grif",1100,3.9);
 pl.pw=[0,1,1.25,2][n];pl.max=[0,320,360,480][n];pl.mmax=[0,140,160,200][n];pl.mr=[0,.22,.3,.45][n];
 Object.assign(pl,{th:null,sa:0,x:100,y:GY-80,vx:0,vy:0,hp:pl.max,mp:pl.mmax,inv:60,kb:0,dd:0,jc:0,ult:n==3?100:0});

/* ---------- efekt / hasar ---------- */
function boom(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(R()-.5)*8,vy:(R()-.5)*8,r:R()*4+1,color:col,a:1,decay:R()*.03+.015,kind:"s"})}
function hit(d,dir){if(pl.inv>0||state!="play")return;pl.hp-=d;snd(90,.2,"sawtooth",.1);pl.inv=35;pl.kb=dir*9;pl.vy=-6;shake=10;boom(pl.x+20,pl.y+30,"#ff4757",14)}
function dmgE(e,d,col,kb){if(e.k=="boss"&&e.intro)return;d*=pl.pw;pl.ult=Math.min(100,pl.ult+d*.1);const r=d*e.ar;dn.push({x:e.x+e.w/2+(R()-.5)*24,y:e.y-10,t:Math.round(r),l:45,c:r>70?"#ffd75e":"#fff"});snd(180,.08,"sawtooth",.04);e.hp-=r;e.hu=6;boom(e.x+e.w/2,e.y+e.h/2,col,10);if(kb&&e.k!="boss"&&e.k!="guts")e.kb=kb}
function wv(x,y,dir,dmg){ep.push({t:"w",x,y,vx:dir*7,vy:0,l:70,dmg})}
function phys(e){e.vy+=G;e.x+=e.vx;const pb=e.y+e.h;e.y+=e.vy;e.gr=0;
 if(e.vy>=0)for(const p of plats){if(e.dt>0&&!p.g)continue;if(e.x+e.w>p.x&&e.x<p.x+p.w&&pb<=p.y+6&&e.y+e.h>=p.y){e.y=p.y-e.h;e.vy=0;e.gr=1;e.x+=p.dx||0;break}}
 if(e.dt>0)e.dt--;e.x=cl(e.x,0,WORLD-e.w)}
const tip=()=>{const cx=pl.x+pl.w/2,cy=pl.y+pl.h/3;return{x:cx+Math.cos(pl.st)*45,y:cy+Math.sin(pl.st)*45}};

function jump(){if(pl.gr){pl.vy=-14.5;pl.jc=1;snd(380,.15,"square",.04)}else if(pl.jc<2){pl.vy=-13.5;pl.jc=2;boom(pl.x+20,pl.y+80,"#9ec5ff",14);snd(560,.15,"triangle",.05)}}
function dash(){if(cd.d>0)return;cd.d=45;pl.dd=9;pl.dir=keys.a?-1:keys.d?1:pl.dir;pl.inv=Math.max(pl.inv,14);snd(250,.18,"sawtooth",.05)}
function tp(){if(cd.x>0||pl.mp<25)return;cd.x=180;pl.mp-=25;const tx=mx+camX,cx=pl.x+20,cy=pl.y+40,a=Math.atan2(my-cy,tx-cx),L=Math.min(Math.hypot(tx-cx,my-cy),460),nx=cl(cx+Math.cos(a)*L-20,0,WORLD-40),ny=Math.min(cy+Math.sin(a)*L-40,GY-80);
 pr.push({t:"p",x:cx,y:cy,l:40,m:40},{t:"p",x:nx+20,y:ny+40,l:40,m:40});boom(cx,cy,"#a55eea",25);boom(nx+20,ny+40,"#7be0ff",25);snd(300,.5,"sine",.08);pl.x=nx;pl.y=ny;pl.vy=0;pl.inv=Math.max(pl.inv,25);flash=.2;shake=6}
function ult(){if(pl.ult<100)return;const cx=pl.x+20,cy=pl.y+40;pr.push({t:"n",x:cx,y:cy,r:0,l:30});shake=25;snd(70,.6,"sawtooth",.15);boom(cx,cy,"#ffd75e",40);en.forEach(e=>{if(Math.hypot(e.x+e.w/2-cx,e.y+e.h/2-cy)<560+e.w/2)dmgE(e,150,"#ffd75e",Math.sign(e.x-cx)*10)});pl.ult=0}
/* ---------- ortak efektler ---------- */
function slam(x,y,pw){pr.push({t:"k",x,y,r:10,l:22},{t:"k",x,y,r:0,l:16},{t:"ig",x,y:y-6,l:22,m:22});neonBurst(x,y,pw);
 flash=Math.max(flash,.55);shake=Math.max(shake,36*pw);hs=Math.max(hs,5);snd(48,.8,"sawtooth",.16);nz(.6,500,50,.28,.6);
 boom(x,y-6,"#ff3050",34);boom(x,y-6,"#c8a0ff",22);boom(x,y-6,"#fff",12);
 for(let j=0;j<30;j++)parts.push({x:x+(R()-.5)*70,y:y-4,vx:(R()-.5)*22*pw,vy:-(6+R()*14),r:R()*5+2,color:j%3?"#4a3a52":"#ff3050",a:1,decay:.018,kind:"d"});
 for(let j=0;j<22;j++)parts.push({x:x+(R()-.5)*90,y:y-4,vx:(R()-.5)*14,vy:-R()*3,r:R()*10+5,color:"#7a6a8a",a:.65,decay:.025,kind:"m"})}
function lzHit(x){pr.push({t:"k",x,y:GY,r:10,l:22},{t:"k",x,y:GY,r:0,l:15},{t:"sc",x,l:150,m:150},{t:"ig",x,y:GY,l:18,m:18});
 flash=.45;shake=Math.max(shake,22);hs=Math.max(hs,3);snd(70,.6,"sawtooth",.14);nz(.5,5000,300,.24,1);
 for(let j=0;j<28;j++){const a=-Math.PI*R();parts.push({x:x+(R()-.5)*40,y:GY-4,vx:Math.cos(a)*(3+R()*9),vy:Math.sin(a)*(5+R()*12),r:R()*3+1.5,color:j%3?"#ff3050":"#fff",a:1,decay:.025,kind:"d"})}
 for(let j=0;j<14;j++)parts.push({x:x+(R()-.5)*80,y:GY-4,vx:(R()-.5)*8,vy:-R()*3,r:R()*8+4,color:"#7a2a3a",a:.6,decay:.03,kind:"m"})}
function strike(x,dmg){pr.push({t:"st",x,l:18,m:18},{t:"k",x,y:GY,r:6,l:16},{t:"ir",x,l:14,m:14});flash=Math.max(flash,.25);shake=Math.max(shake,10);snd(120,.3,"sawtooth",.1);nz(.3,4500,500,.2,1);
 for(let j=0;j<16;j++){const a=-Math.PI*R();parts.push({x,y:GY-4,vx:Math.cos(a)*(3+R()*8),vy:Math.sin(a)*(4+R()*10),r:R()*2.5+1,color:j%2?"#fff":"#8cf",a:1,decay:.035,kind:"d"})}
 if(Math.abs(pl.x+20-x)<42&&pl.y+pl.h>=GY-70)hit(dmg,Math.sign(pl.x+20-x)||1)}
function mimp(x,y){const g0=y>=GY-14;pr.push({t:"k",x,y,r:6,l:22},{t:"k",x,y,r:0,l:16},{t:"ig",x,y,l:22,m:22,c:1});
 if(g0){pr.push({t:"sc",x,l:220,m:220,f:1});for(let i=0;i<5;i++)pr.push({t:"mf",x:x+(R()-.5)*130,l:60+(R()*50|0),m:110,w:14+R()*14})}
 for(let j=0;j<18;j++){const a=-Math.PI*R();parts.push({x,y,vx:Math.cos(a)*(4+R()*9),vy:Math.sin(a)*(6+R()*12),r:R()*4+2,color:["#ffd43b","#ff7a1a","#ff3d00"][j%3],a:1,decay:.02,kind:"d"})}
 for(let j=0;j<10;j++)parts.push({x:x+(R()-.5)*60,y:y-4,vx:(R()-.5)*7,vy:-R()*4,r:R()*9+5,color:"#3a3030",a:.6,decay:.02,kind:"m"});
 hs=Math.max(hs,2);nz(.5,2500,120,.2,.8)}
/* ---------- büyüler ---------- */
function cast(k){if(boss&&boss.intro)return;const t=tip(),tx=mx+camX;if(wp&&(k=="f"||k=="b"))return melee(k,t,tx);
 if(k=="f"&&cd.f<=0&&pl.mp>=4){cd.f=14;pl.mp-=4;snd(500,.12,"triangle");const a=Math.atan2(my-t.y,tx-t.x);pr.push({t:"f",x:t.x,y:t.y,vx:Math.cos(a)*14,vy:Math.sin(a)*14,d:0});boom(t.x,t.y,"#ff7f50",6)}
 if(k=="b"&&cd.b<=0&&pl.mp>=14){cd.b=30;pl.mp-=14;thunder();shake=Math.max(shake,9);const a=Math.atan2(my-t.y,tx-t.x),L=Math.min(Math.hypot(tx-t.x,my-t.y),520),ex=t.x+Math.cos(a)*L,ey=t.y+Math.sin(a)*L;
  pr.push({t:"b",sx:t.x,sy:t.y,ex,ey,l:16});flash=.24;boom(ex,ey,"#a55eea",24);boom(ex,ey,"#fff",12);
  en.forEach(e=>{for(let d=0;d<=L;d+=8){const px=t.x+Math.cos(a)*d,py=t.y+Math.sin(a)*d;if(px>e.x-10&&px<e.x+e.w+10&&py>e.y-10&&py<e.y+e.h+10){dmgE(e,48,"#c8a2ff",Math.cos(a)*5);break}}})}
 if(k=="z"&&cd.z<=0&&pl.mp>=30){cd.z=150;pl.mp-=30;snd(120,.5,"triangle",.08);nz(1.1,300,1300,.14,.7);pr.push({t:"z",x:pl.x+20+pl.dir*70,y:pl.y+pl.h,vx:pl.dir*4.5,l:170,tk:0})}
 if(k=="e"&&cd.e<=0&&pl.mp>=45){cd.e=240;pl.mp-=45;snd(90,.6,"sawtooth",.1);for(let i=0;i<9;i++)pr.push({t:"m",x:tx+(i-4)*80+R()*40+300,y:-120-R()*200,vx:-5.5-R()*1.5,vy:15+R()*4,r:18+R()*14,rot:R()*6,del:i*6+(R()*10|0)})}
}

/* ---------- düşman yapay zekası ---------- */
function ai(e){
 const dx=pl.x+pl.w/2-(e.x+e.w/2),d=Math.abs(dx),dy=(pl.y+pl.h)-(e.y+e.h);e.dir=dx<0?-1:1;if(e.cd>0)e.cd--;if(e.thr>0)e.thr--;if(e.bc>0)e.bc--;
 if(e.sw>0){e.sw--;if(e.sw==0&&e.k=="hizli"&&R()<.4)e.cd=6;if(e.k=="hizli"&&e.sw>8)e.vx=e.dir*11;else e.vx*=.6;
  if(e.sw==e.hitAt){if(d<e.rng+18&&Math.abs(dy)<70)hit(e.dmg,e.dir);if(e.k=="zirhli"){wv(e.x+e.w/2,e.y+e.h,e.dir,e.dmg*.8);shake=6}}}
 else if(e.k=="hizli"&&d<230&&d>40&&Math.abs(dy)<60&&e.cd<=0){e.sw=e.swT=24;e.hitAt=5;e.cd=75}
 else if(e.k!="hizli"&&d<e.rng&&Math.abs(dy)<60&&e.cd<=0){e.sw=e.swT=e.k=="zirhli"?36:18;e.hitAt=Math.floor(e.sw*.3);e.cd=e.k=="zirhli"?85:45;e.vx=0}
 else if(e.k=="suikast"&&d>170&&d<500&&Math.abs(dy)<130&&e.cd<=0){[-1,0,1].forEach(q=>ep.push({t:"d",x:e.x+e.w/2,y:e.y+36,vx:e.dir*10,vy:dy*.012+q*1.2,r:6,l:90,dmg:e.dmg*.7}));e.cd=80;e.thr=12;e.vx=0}
 else if(e.k=="suikast"&&!(e.bc>0)&&d>130&&d<460&&Math.abs(dy)<70){e.bc=260;boom(e.x+e.w/2,e.y+40,"#44ff99",16);e.x=cl(pl.x-pl.dir*85,0,WORLD-e.w);boom(e.x+e.w/2,e.y+40,"#44ff99",16);snd(500,.15,"sine",.06);e.cd=18}
 else if(e.k=="zirhli"&&!(e.bc>0)&&d>220&&d<560&&Math.abs(dy)<120&&e.cd<=0){e.bc=300;e.cd=60;e.thr=14;e.vx=0;ep.push({t:"bm",x:e.x+e.w/2,y:e.y+30,vx:cl(dx/44,-9,9),vy:-9,g:.4,r:11,l:140,dmg:e.dmg*.9});snd(200,.15,"square",.06)}
 else{e.vx=e.dir*e.sp*(e.k=="suikast"&&d<150?-.8:1);
  if(e.gr&&dy<-50&&d<340)e.vy=-e.jmp;if(e.gr&&dy>70&&d<220)e.dt=14}
}
function bossAI(b){
